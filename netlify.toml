[build]
  command = "npm run build"
  publish = "out"

[build.environment]
  NODE_VERSION = "24"

# One canonical host. The Netlify subdomain served the original waitlist and
# would otherwise be indexed as a duplicate of quantumx.ventures.
[[redirects]]
  from = "https://qx-ventures.netlify.app/*"
  to = "https://quantumx.ventures/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.quantumx.ventures/*"
  to = "https://quantumx.ventures/:splat"
  status = 301
  force = true

# Build assets are content-hashed and safe to cache forever.
[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Images and share images are not hashed: cache, but allow revalidation so a
# replaced share image is picked up by crawlers within a day.
[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=86400"

[[headers]]
  for = "/og/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    # Scripts and connections are limited to this site, Google Analytics and
    # reCAPTCHA. 'unsafe-inline' is needed for the inline scripts Next's static
    # export writes and the reveal snippet in app/layout.tsx.
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com https://www.google.com https://www.gstatic.com; connect-src 'self' https://*.google-analytics.com https://*.analytics.google.com https://www.googletagmanager.com https://www.google.com; img-src 'self' data: https://*.google-analytics.com https://www.googletagmanager.com https://www.google.com https://www.gstatic.com; style-src 'self' 'unsafe-inline'; font-src 'self'; frame-src https://www.google.com; frame-ancestors 'self'; form-action 'self'; base-uri 'self'; object-src 'none'; upgrade-insecure-requests"
