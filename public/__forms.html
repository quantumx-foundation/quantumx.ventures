<!--
  Static form definitions for Netlify Forms detection.
  The visible forms are rendered by React, which Netlify's build-time parser
  cannot read, so these hidden copies register them. Keep the field names in
  sync with components/contact-form.tsx, components/foundership-form.tsx
  and components/updates-form.tsx.

  "waitlist" is the form name used by the original QuantumX Ventures waitlist
  page, kept so existing submissions and notifications continue in one place.
-->
<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="robots" content="noindex" />
    <title>Netlify form detection</title>
  </head>
  <body>
    <form name="venture-inquiry" data-netlify="true" netlify-honeypot="fax_number" hidden>
      <input type="hidden" name="form-name" value="venture-inquiry" />
      <input name="name" />
      <input type="email" name="email" />
      <input name="organisation" />
      <select name="role">
        <option>Founder</option>
        <option>Researcher</option>
        <option>Technical team</option>
        <option>Partner or investor</option>
        <option>Other</option>
      </select>
      <textarea name="message"></textarea>
      <input name="fax_number" />
    </form>

    <form name="foundership" data-netlify="true" netlify-honeypot="fax_number" hidden>
      <input type="hidden" name="form-name" value="foundership" />
      <input name="name" />
      <input type="email" name="email" />
      <input type="tel" name="phone" />
      <input name="location" />
      <input name="company" />
      <select name="stage">
        <option>Idea</option>
        <option>Research result</option>
        <option>Prototype</option>
        <option>Early customers</option>
        <option>Revenue</option>
      </select>
      <select name="focusArea">
        <option>Quantum Computing</option>
        <option>Quantum Communication &amp; Networking</option>
        <option>Quantum Sensing &amp; Metrology</option>
        <option>Quantum Materials &amp; Devices</option>
        <option>Quantum Software &amp; Algorithms</option>
        <option>Post-Quantum Cryptography &amp; Quantum Security</option>
        <option>Quantum AI &amp; Machine Learning</option>
        <option>Quantum Applications &amp; Industry Solutions</option>
        <option>Quantum Infrastructure &amp; Enabling Technologies</option>
        <option>Quantum Education &amp; Workforce Development</option>
        <option>Other</option>
      </select>
      <select name="teamSize">
        <option>Solo founder</option>
        <option>2–3 people</option>
        <option>4 or more</option>
      </select>
      <select name="commitment">
        <option>Full-time</option>
        <option>Part-time</option>
        <option>Still in a lab or university</option>
      </select>
      <select name="referral">
        <option>X</option>
        <option>LinkedIn</option>
        <option>Event or hackathon</option>
        <option>Friend or referral</option>
        <option>QuantumX Foundation</option>
        <option>Search</option>
        <option>Other</option>
      </select>
      <input name="support" />
      <input name="raising" />
      <input type="url" name="founderProfile" />
      <input type="url" name="xProfile" />
      <input type="url" name="github" />
      <input type="url" name="website" />
      <textarea name="pitch"></textarea>
      <input name="fax_number" />
    </form>

    <form name="waitlist" data-netlify="true" netlify-honeypot="fax_number" hidden>
      <input type="hidden" name="form-name" value="waitlist" />
      <input type="email" name="email" />
      <input name="fax_number" />
    </form>
  </body>
</html>
