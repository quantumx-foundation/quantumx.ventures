[build]
  command = "npm run build"
  publish = "out"

[build.environment]
  NODE_VERSION = "20"

# One canonical host. The Netlify subdomain served the original waitlist and
# would otherwise be indexed as a duplicate of quantumx.ventures.
[[redirects]]
  from = "https://qx-ventures.netlify.app/*"
  to = "https://quantumx.ventures/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.quantumx.ventures/*"
  to = "https://quantumx.ventures/:splat"
  status = 301
  force = true

# Build assets are content-hashed and safe to cache forever.
[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Images and share images are not hashed: cache, but allow revalidation so a
# replaced share image is picked up by crawlers within a day.
[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=86400"

[[headers]]
  for = "/og/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
